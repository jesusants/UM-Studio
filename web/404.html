<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UM Studio — Redirigiendo...</title>
  <script>
    // GitHub Pages SPA redirect preserving query params (?code=...&state=...) and hash
    (function() {
      var path = window.location.pathname;
      var repoBase = '/UM-Studio';
      var query = window.location.search || '';
      var hash = window.location.hash || '';

      // If user landed on /UM-Studio/something, redirect to /UM-Studio/ with params
      var redirectUrl = repoBase + '/' + query + hash;
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body style="background-color: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p style="font-size: 14px; opacity: 0.7;">Redirigiendo a UM Studio...</p>
</body>
</html>
